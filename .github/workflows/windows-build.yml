name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check persistence and scheduling
        run: dotnet run --project Tests/Levitation.Core.Checks.csproj -c Release
      - name: Build and publish standalone Windows app
        run: dotnet publish Levitation.csproj -c Release -r win-x64 --self-contained true -o Publish/win-x64
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (dotnet msbuild Levitation.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Unable to read the app version.' }
          $name = "Levitation-$version-win-x64"
          Copy-Item README.md,LICENSE -Destination Publish/win-x64/
          Compress-Archive -Path Publish/win-x64/* -DestinationPath "Publish/$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: Publish/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
